# OPTIONAL host-level Nginx for HTTPS on EC2 (only needed when you have a domain).
# Setup: docs/AWS_DEPLOYMENT.md, section "Enabling HTTPS". Replace store.example.com with your domain.

server {
    listen 80;
    listen [::]:80;
    server_name store.example.com;
    server_tokens off;

    client_max_body_size 1m;

    # Used by certbot for the HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
