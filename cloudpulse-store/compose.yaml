# Only the frontend (Nginx) publishes a port. The backend is reachable solely
# on the internal "cloudpulse" network, via Nginx at /api/.

name: cloudpulse-store

services:
  backend:
    build:
      context: ./backend
    image: cloudpulse-store-backend:latest
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      DATABASE_URL: sqlite:////app/data/cloudpulse.db
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"
    networks:
      - cloudpulse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
    image: cloudpulse-store-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # HTTP_BIND=127.0.0.1 + HTTP_PORT=8080 when a host-level Nginx terminates HTTPS (see docs).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    networks:
      - cloudpulse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # localhost only; use an SSH tunnel on EC2
    networks:
      - cloudpulse
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # localhost only; use an SSH tunnel on EC2
    networks:
      - cloudpulse
    depends_on:
      - prometheus

networks:
  cloudpulse:
    driver: bridge

volumes:
  sqlite_data:
  prometheus_data:
  grafana_data:
