# Only the frontend (Nginx) publishes a port. Nginx sends every /api/* request to the
# CloudPulse scheduling gateway, which routes it to one of THREE backend replicas using the
# CloudPulse scheduling algorithms (RR / WRR / least-loaded / SJF / FCFS control).
#
# Backend heterogeneity is REAL: each replica gets a CPU quota proportional to its scheduler
# capacity (1.0 / 0.6 / 0.4 -> 0.75 / 0.45 / 0.30 CPU by default), like the scheduler's live
# cluster. All replicas share one SQLite database (WAL mode) on the sqlite_data volume.

name: cloudpulse-store

x-backend: &backend
  build:
    context: ./backend
  image: cloudpulse-store-backend:latest
  restart: unless-stopped
  expose:
    - "8000"
  networks:
    - cloudpulse
  volumes:
    - sqlite_data:/app/data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4).status == 200 else 1)"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  DATABASE_URL: sqlite:////app/data/cloudpulse.db
  # Failure demo (dashboard "Real crash"): POST /admin/crash kills the replica's process. The path is
  # outside /api/, so Nginx never forwards it; only the gateway on this private network can call it.
  ENABLE_CHAOS: ${ENABLE_CHAOS:-true}

services:
  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: cloudpulse-store-backend-1
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}   # only replica 1 creates tables and seeds
    deploy:
      resources:
        limits:
          cpus: "${B1_CPUS:-0.75}"
          memory: 256M

  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: cloudpulse-store-backend-2
      SEED_ON_STARTUP: "false"
    depends_on:
      backend-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${B2_CPUS:-0.45}"
          memory: 256M

  backend-3:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: cloudpulse-store-backend-3
      SEED_ON_STARTUP: "false"
    depends_on:
      backend-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${B3_CPUS:-0.30}"
          memory: 256M

  gateway:
    build:
      context: ..                                   # monorepo root: needs cloudpulse-scheduler/src
      dockerfile: cloudpulse-store/scheduler-gateway/Dockerfile
    image: cloudpulse-scheduler-gateway:latest
    restart: unless-stopped
    environment:
      ALGORITHM: ${ALGORITHM:-least_loaded}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # id / url / scheduler capacity / WRR weight / concurrent request slots per replica
      BACKENDS_JSON: >-
        [{"id":"B1","url":"http://backend-1:8000","capacity":1.0,"weight":5,"slots":${B1_SLOTS:-4}},
         {"id":"B2","url":"http://backend-2:8000","capacity":0.6,"weight":3,"slots":${B2_SLOTS:-2}},
         {"id":"B3","url":"http://backend-3:8000","capacity":0.4,"weight":2,"slots":${B3_SLOTS:-2}}]
    ports:
      # Gateway API (/gateway/stats, /gateway/metrics, algorithm switch) on its own port, localhost only.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8090}:8090"
    networks:
      - cloudpulse
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/gateway/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 160M

  frontend:
    build:
      context: ./frontend
    image: cloudpulse-store-frontend:latest
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # HTTP_BIND=127.0.0.1 + HTTP_PORT=8080 when a host-level Nginx terminates HTTPS (see docs).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    networks:
      - cloudpulse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # Website workload generator, driven from the Streamlit dashboard ("Website workload" page).
  # Sends shopper API requests to the website entry point (Nginx), so they are scheduled by the
  # gateway exactly like browser clicks.
  loadgen:
    build:
      context: ./loadgen
    image: cloudpulse-store-loadgen:latest
    restart: unless-stopped
    environment:
      TARGET_URL: http://frontend
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${LOADGEN_BIND:-127.0.0.1}:${LOADGEN_PORT:-8095}:8095"   # localhost only; dashboard uses the network
    networks:
      - cloudpulse
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8095/loadgen/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:9090:9090"   # localhost only (two-EC2 setup: private IP, SG-restricted)
    networks:
      - cloudpulse
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (cp .env.example .env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # localhost only; use an SSH tunnel on EC2
    networks:
      - cloudpulse
    depends_on:
      - prometheus

networks:
  cloudpulse:
    driver: bridge

volumes:
  sqlite_data:
  prometheus_data:
  grafana_data:
