upstream cloudpulse_backend {
    server backend:8000;
    keepalive 32;
}

# Keep the original scheme (https) when a host-level proxy terminates TLS on EC2.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nginx connection statistics, reachable only from inside the Docker network / host.
    location = /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location /api/ {
        # Optional: restrict Prometheus metrics to known scrapers on a public server.
        # location = /api/metrics { allow <monitoring-server-ip>; deny all; proxy_pass http://cloudpulse_backend; }

        proxy_pass http://cloudpulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Product placeholder images only. /products/<id> (no extension) is a React
    # route and falls through to the SPA location below.
    location ~* ^/products/[a-z0-9-]+\.svg$ {
        expires 7d;
        try_files $uri =404;
    }

    # Never serve hidden files or anything that looks like a database.
    location ~ /\. { deny all; }
    location ~* \.(db|sqlite|sqlite3)$ { deny all; }

    # Single-page app: unknown paths (e.g. /products/3, /cart) load index.html
    # and React Router renders the correct page.
    # Note: no "$uri/" here - /products is both a React route and the image
    # folder, and "$uri/" would redirect it to the folder (301 -> 403).
    location / {
        try_files $uri /index.html;
        expires -1;  # always revalidate index.html so new deployments show up
    }
}
